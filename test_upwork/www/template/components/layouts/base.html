      <script>
        // IP Detection Function
        function getIp(callback) {
          fetch('https://ipinfo.io/json?token=45c3f864280ba7', {
            headers: { 'Accept': 'application/json' },
            timeout: 5000
          })
            .then(resp => {
              if (!resp.ok) throw new Error('IP lookup failed');
              return resp.json();
            })
            .catch(error => {
              console.warn('IP detection failed:', error);
              return { country: 'us' }; // Default to US in case of failure
            })
            .then(resp => callback(resp.country.toLowerCase()));
        }
        
        // Initialize International Phone Input
        document.addEventListener('DOMContentLoaded', function() {
          const phoneInputField = document.querySelector("#phone");
          
          const phoneInput = window.intlTelInput(phoneInputField, {
            initialCountry: "auto",
            geoIpLookup: getIp,
            utilsScript: "//cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
            separateDialCode: true,
            preferredCountries: ['us', 'gb', 'ca'],
            hiddenInput: "full",
          });
        
          // Form Validation and Full Number Handling
          const form = document.querySelector('#phone-form');
          form.addEventListener('submit', function(event) {
            if (!phoneInput.isValidNumber()) {
              event.preventDefault();
              const errorAlert = document.querySelector('.alert-info');
              errorAlert.textContent = 'Please enter a valid phone number';
              errorAlert.style.display = 'block';
            } else {
              // Store full international number in hidden input
              phoneInputField.value = phoneInput.getNumber(intlTelInputUtils.numberFormat.E164);
              alert(phoneInputField.value); // Optional: show alert with full phone number
              const errorAlert = document.querySelector('.alert-info');
              errorAlert.style.display = 'none';
            }
          });
        
          // Real-time Validation
          phoneInputField.addEventListener('input', function() {
            const errorAlert = document.querySelector('.alert-info');
            if (phoneInput.isValidNumber()) {
              errorAlert.style.display = 'none';
            } else {
              errorAlert.textContent = 'Invalid phone number format';
              errorAlert.style.display = 'block';
            }
          });
        });
        </script>
